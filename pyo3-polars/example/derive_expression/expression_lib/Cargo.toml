[package]
name = "expression_lib"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "expression_lib"
crate-type = ["cdylib"]

[dependencies]
num = "0.4.3"
polars = { workspace = true, features = ["timezones", "allow_unused"] }
polars-arrow = { workspace = true, default-features = false }
polars-ffi = { workspace = true, features = ["dsl_rewrite"] }
polars-plan = { workspace = true, features = [
  "dsl_rewrite",
  "dtype-date",
  "dtype-datetime",
  "dtype-duration",
  "dtype-extension",
  "dtype-struct",
  "ffi_plugin",
  "serde",
] }
pyo3 = { workspace = true }
pyo3-polars = { workspace = true, features = ["derive"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
