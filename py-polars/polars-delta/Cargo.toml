[package]
name = "polars-delta-python"
# Released independently of Polars: the version of the PyPI package `polars-delta`, equal to the
# `version` of `crates/polars-delta` (the module's `__version__`).
version = "0.2.0"
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = "https://github.com/pola-rs/polars"
description = "Python extension module (`polars_delta`) of the `polars-delta` package."

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
polars-delta = { path = "../../crates/polars-delta", features = ["python"] }
pyo3 = { workspace = true, features = ["abi3-py310", "extension-module"] }

[lints]
workspace = true
