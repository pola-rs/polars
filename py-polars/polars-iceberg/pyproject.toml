[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polars-iceberg"
description = "Native Iceberg scan planning plugin for Polars (dependency of the polars package)"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# From `package.version` in the wrapper crate `Cargo.toml`.
dynamic = ["version"]

[project.urls]
Homepage = "https://www.pola.rs/"
Polars = "https://pypi.org/project/polars/"
Repository = "https://github.com/pola-rs/polars"

[tool.maturin]
module-name = "polars_iceberg"
# Keep the license at the sdist root for Python package metadata.
include = [{ path = "LICENSE", format = "sdist" }]
