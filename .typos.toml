[files]
extend-exclude = [
  ".git/",
  "*.csv",
  "*.gz",
  "dists.dss",
  "**/images/*",
  "**/py-polars/src/polars/_utils/nest_asyncio.py",
  "*.nix",
  "**/crates/polars-plan/dsl-schema-hashes.json",
  "**/_polars_runtime*/",
]
ignore-hidden = false

[default]
extend-ignore-re = ['"Theatre": \[.+\],', 'HashiCorp']

[default.extend-words]
arange = "arange"
ser = "ser"
splitted = "splitted"
strat = "strat"
striter = "striter"
typ = "typ"
aimd = "aimd"
# `flate2` crate.
flate = "flate"
# prefix of authenticate/authentication (substring match)
authenticat = "authenticat"

[default.extend-identifiers]
AKS = "AKS"
ba_field = "ba_field"

[type.py]
extend-ignore-re = [
  '\.flags\.writeable\b',
  # Test data in the `scan_database` tests.
  'rvc_pg_nd',
  "'ABD'",
  "'abd'",
  '"abd"',
  'Pr0v1ded',
]

[type.py.extend-identifiers]
ba = "ba"
ody = "ody"
ND = "ND"
nd = "nd"
NDArray1D = "NDArray1D"

[type.rust.extend-words]
# Prefix of DOUBLE in `polars-database`'s type matching (substring match).
DOUB = "DOUB"

[type.rust.extend-identifiers]
ANDed = "ANDed"
bck = "bck"
Fo = "Fo"
ND = "ND"
nd = "nd"
NDJson = "NDJson"
NDJsonSinkNode = "NDJsonSinkNode"
NDJsonReaderBuilder = "NDJsonReaderBuilder"
NDJsonReadOptions = "NDJsonReadOptions"
NDJsonFileReader = "NDJsonFileReader"
NDJsonWriterStarter = "NDJsonWriterStarter"
NDJsonWriterOptions = "NDJsonWriterOptions"
opt_nd = "opt_nd"
tpe = "tpe"
lits = "lits"
