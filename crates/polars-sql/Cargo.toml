[package]
name = "polars-sql"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "SQL transpiler for Polars. Converts SQL to Polars logical plans"

[dependencies]
polars-compute = { workspace = true, features = ["dtype-decimal"] }
polars-core = { workspace = true, features = ["rows"] }
polars-defs = { workspace = true }
polars-error = { workspace = true }
polars-io = { workspace = true }
polars-lazy = { workspace = true, features = ["abs", "binary_encoding", "concat_str", "cov", "cross_join", "cum_agg", "dtype-array", "dtype-date", "dtype-decimal", "dtype-struct", "is_in", "list_eval", "log", "meta", "offset_by", "propagate_nans", "range", "regex", "round_series", "sign", "string_normalize", "string_pad", "string_reverse", "strings", "timezones", "trigonometry"] }
polars-ops = { workspace = true, features = ["iejoin"] }
polars-plan = { workspace = true, features = ["iejoin"] }
polars-testing = { workspace = true }
polars-utils = { workspace = true }

bitflags = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
hex = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sqlparser = { workspace = true }

[dev-dependencies]
# to display dataframes in case of test failures
polars-core = { workspace = true, features = ["fmt"] }
# required for local runs of the 'iss_23134' test
polars-lazy = { workspace = true, features = ["streaming"] }

[features]
default = []
nightly = ["polars-lazy/nightly"]
approx_quantile = ["polars-lazy/approx_quantile"]
asof_join = ["polars-lazy/asof_join", "polars-lazy/dtype-i128"]
binary_encoding = ["polars-lazy/binary_encoding"]
bitwise = ["polars-lazy/bitwise"]
# `read_csv` parses dates by default, which needs the temporal dtypes.
csv = ["polars-lazy/csv", "polars-io/csv", "polars-io/temporal"]
diagonal_concat = ["polars-lazy/diagonal_concat"]
dtype-decimal = ["polars-lazy/dtype-decimal"]
# Opt-in: `dtype-map` also makes Arrow `MAP` columns import as `Map` instead of `List(Struct)`, program-wide.
dtype-map = ["polars-lazy/dtype-map", "polars-io/dtype-map", "polars-ops/dtype-map"]
# `read_ipc` infers hive values with date parsing, which needs the temporal dtypes.
ipc = ["polars-lazy/ipc", "polars-plan/ipc", "polars-io/ipc", "polars-io/temporal"]
# `read_ndjson` schemas can name temporal types, which the NDJSON reader needs enabled.
json = [
  "polars-lazy/json",
  "polars-plan/json",
  "polars-lazy/extract_jsonpath",
  "polars-plan/extract_jsonpath",
  "polars-io/temporal",
]
list_eval = ["polars-lazy/list_eval"]
# `read_parquet` infers hive values with date parsing, which needs the temporal dtypes.
parquet = ["polars-lazy/parquet", "polars-plan/parquet", "polars-io/parquet", "polars-io/temporal"]
rank = ["polars-lazy/rank"]
rolling_window = ["polars-lazy/rolling_window"]
semi_anti_join = ["polars-lazy/semi_anti_join"]
serde = ["polars-utils/serde"]
timezones = ["polars-lazy/timezones"]
dynamic_group_by = ["polars-lazy/dynamic_group_by"]

[lints]
workspace = true
