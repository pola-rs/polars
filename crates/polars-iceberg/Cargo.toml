[package]
name = "polars-iceberg"
# Released independently of Polars; compatibility is decided by the plugin IDs it exports (see
# `polars-io-ext-ffi`), not by this version.
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = "https://github.com/pola-rs/polars"
description = "Native Iceberg scan planning plugin for Polars."

# The Python package `polars-iceberg` is built from `py-polars/polars-iceberg`. Builds of the
# Polars workspace exclude this crate by default.

[lib]
name = "polars_iceberg"
crate-type = ["rlib"]

[dependencies]
chrono = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
futures = { workspace = true }
hex = { workspace = true }
# Used only to build Arrow data, which crosses the plugin boundary through the Arrow C Data
# Interface; this does not couple the plugin to the host's Polars version.
polars-arrow = { workspace = true }
polars-error = { workspace = true }
polars-io-ext-ffi = { workspace = true, features = ["iceberg"] }
polars-utils = { workspace = true }
pyo3 = { workspace = true, optional = true, features = ["abi3-py310", "extension-module"] }
serde = { workspace = true }
# `float_roundtrip`: filter literals must parse to the exact float PyIceberg serialized.
# `unbounded_depth`: see `iceberg::json`.
serde_json = { workspace = true, features = ["float_roundtrip", "unbounded_depth"] }
snap = { version = "1" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
zstd = { workspace = true }

[features]
# Python extension module (`polars_iceberg`) exposing the plugin contract as a PyCapsule.
python = ["dep:pyo3"]

[lints]
workspace = true
