name: Release polars-iceberg

# Releases the `polars-iceberg` I/O plugin (`py-polars/polars-iceberg` in this repository) to PyPI.
#
# The version is the `version` of the wrapper crate `py-polars/polars-iceberg/Cargo.toml`, which
# must be the one in `crates/polars-iceberg/Cargo.toml` (the module's `__version__`). The plugin
# is an abi3 wheel, so one wheel per target covers every supported Python version.
#
# The `version` job resolves the commit once; the other jobs build that commit. After publishing,
# the release tags it `polars-iceberg-<version>`.

on:
  workflow_dispatch:
    inputs:
      # Commit to release. If omitted, use the latest commit of the branch the workflow runs on.
      sha:
        description: Commit SHA
        type: string
      # Create the sdist and build the wheels, but do not publish to PyPI or tag the commit.
      dry-run:
        description: Dry run
        type: boolean
        default: false

# Releases queue rather than cancel each other: a cancelled run may have uploaded part of a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'
  PYTHON_VERSION_WIN_ARM64: '3.11' # ARM64 Windows doesn't have older versions
  MANIFEST_PATH: py-polars/polars-iceberg/Cargo.toml
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The commit every job builds.
      sha: ${{ steps.commits.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      # Whether the tag exists already, on this commit (a rerun).
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Read polars-iceberg version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("py-polars/polars-iceberg/Cargo.toml", "rb"))["package"]["version"])')
          echo "polars-iceberg version: $VERSION"
          # The module's `__version__` comes from the plugin crate.
          LIB_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/polars-iceberg/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$LIB_VERSION" != "$VERSION" ]]; then
            echo "::error::crates/polars-iceberg version $LIB_VERSION does not match $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve commit
        id: commits
        run: |
          SHA=$(git rev-parse HEAD)
          echo "commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # A tag on another commit means the version was released before: bump it.
      - name: Check the tag
        id: tag
        env:
          TAG: polars-iceberg-${{ steps.version.outputs.version }}
          SHA: ${{ steps.commits.outputs.sha }}
        run: |
          # The last line is the commit, also for an annotated tag (`<tag>^{}`).
          TAGGED=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)
          if [[ -n "$TAGGED" && "$TAGGED" != "$SHA" ]]; then
            echo "::error::$TAG already tags $TAGGED: bump the polars-iceberg version to release $SHA"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tagged=$([[ -n "$TAGGED" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  create-sdist:
    needs: [version]
    runs-on: ubuntu-latest
    env:
      POLARS_ICEBERG_BUILD_COMMIT: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path ${{ env.MANIFEST_PATH }}
            --out dist
          maturin-version: 1.15.0

      - name: Test sdist
        run: |
          pip install --force-reinstall --verbose dist/*.tar.gz
          python -c 'import polars_iceberg'

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist-polars-iceberg
          path: dist/*.tar.gz

  build-wheels:
    needs: [version]
    runs-on: ${{ matrix.os }}
    env:
      POLARS_ICEBERG_BUILD_COMMIT: ${{ needs.version.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        job_config: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, macos-x64, macos-arm64, win-x64, win-arm64]
        include:
          - job_config: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - job_config: linux-arm64
            os: linux-arm-large
            target: aarch64-unknown-linux-gnu
          - job_config: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - job_config: linux-musl-arm64
            os: linux-arm-large
            target: aarch64-unknown-linux-musl
          - job_config: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - job_config: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - job_config: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - job_config: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      # After the checkout, which the local action needs.
      - name: Setup build environment (ARM64 Windows)
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/setup-windows-arm64

      # The wheel is abi3 for Python 3.10+ whichever Python builds it.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.os == 'windows-11-arm' && env.PYTHON_VERSION_WIN_ARM64 || env.PYTHON_VERSION }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          # Forward the build commit into the manylinux/musllinux container.
          docker-options: -e POLARS_ICEBERG_BUILD_COMMIT
          args: >
            --profile ${{ inputs.dry-run == true && 'dev' || 'dist-release' }}
            --manifest-path ${{ env.MANIFEST_PATH }}
            --out dist
          manylinux: auto
          maturin-version: 1.15.0

      - name: Test wheel
        # musl wheels cannot be installed on the glibc runners.
        if: endsWith(matrix.target, '-musl') == false
        run: |
          pip install --force-reinstall --verbose dist/*.whl
          # The Python release compares this commit with its own sources.
          # `tr`: Python on Windows ends the line with CRLF.
          COMMIT=$(python -c 'import polars_iceberg; print(polars_iceberg.__build_commit__)' | tr -d '\r')
          if [[ "$COMMIT" != "$POLARS_ICEBERG_BUILD_COMMIT" ]]; then
            echo "::error::__build_commit__ is '$COMMIT', expected $POLARS_ICEBERG_BUILD_COMMIT"
            exit 1
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-polars-iceberg-${{ matrix.job_config }}
          path: dist/*.whl

  publish-to-pypi:
    needs: [version, create-sdist, build-wheels]
    environment:
      name: release-polars-iceberg
      url: https://pypi.org/project/polars-iceberg
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check sdist and wheel versions match Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls dist
          for f in dist/*; do
            name=$(basename "$f")
            if [[ "$name" != "polars_iceberg-$VERSION.tar.gz" && "$name" != "polars_iceberg-$VERSION-"*.whl ]]; then
              echo "::error::$name does not have polars-iceberg version $VERSION"
              exit 1
            fi
          done

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  tag:
    needs: [version, publish-to-pypi]
    if: inputs.dry-run == false && needs.version.outputs.tagged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
