name: Test Python

on:
  merge_group:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
      - "1.x"
    paths:
      - Cargo.lock
      - crates/**
      - docs/source/src/python/**
      - py-polars/**
      - .github/workflows/test-python.yml
  # Called by the release workflow, which tests against the released polars-iceberg and
  # polars-database from PyPI.
  workflow_call:
    inputs:
      sha:
        description: Commit SHA of Polars to test
        type: string
      polars-iceberg-version:
        description: >
          Version of polars-iceberg to install from PyPI. If omitted, build polars-iceberg from this
          repository.
        type: string
      polars-database-version:
        description: >
          Version of polars-database to install from PyPI. If omitted, build polars-database from
          this checkout.
        type: string

concurrency:
  # Not `github.workflow`, which is the caller's name when called from another workflow.
  group: test-python-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1

defaults:
  run:
    working-directory: py-polars
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/actions

      - name: Check for relevant changes
        id: changes
        uses: ./.github/actions/changed-paths
        with:
          # Keep in sync with `on.push.paths`.
          paths: |
            Cargo.lock
            crates/
            docs/source/src/python/
            py-polars/
            .github/workflows/test-python.yml

  test-python:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' && !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    env: &test-python-env
      POLARS_IDEAL_MORSEL_SIZE: ${{ matrix.ideal_morsel_size }}
      # Slow tests are prohibitively slow with a tiny morsel size.
      EXTRA_PYTEST_MARKERS: ${{ matrix.ideal_morsel_size < 10 && ' and not slow' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        variant: [null]
        ideal_morsel_size: [100000]
        include:
          - os: windows-latest
            python-version: '3.14'
            ideal_morsel_size: 100000
            variant: null
          - os: windows-latest
            python-version: '3.14'
            variant: engine_affinity_in_memory
            ideal_morsel_size: 100000
          - os: ubuntu-latest
            python-version: '3.14'
            variant: null
            ideal_morsel_size: 4
          - os: ubuntu-latest
            python-version: '3.14'
            variant: engine_affinity_in_memory
            ideal_morsel_size: 100000

    steps: &test-python-steps
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1
        if: ${{ runner.os == 'Linux' }}

      - name: Enable long paths on Windows
        if: matrix.os == 'windows-latest'
        shell:
          powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Create virtual environment
        env:
          BIN: ${{ matrix.os == 'windows-latest' && 'Scripts' || 'bin' }}
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/py-polars/.venv/$BIN" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/py-polars/.venv" >> $GITHUB_ENV
          echo "VENV=$GITHUB_WORKSPACE/py-polars/.venv" >> $GITHUB_ENV

      - name: Install maturin
        if: matrix.python-version == '3.15t'
        run: |
          pip install uv
          uv pip install maturin

      - name: Install Python dependencies
        if: matrix.python-version != '3.15t'
        run: |
          pip install uv
          # Install typing-extensions separately whilst the `--extra-index-url` in `requirements-ci.txt`
          # doesn't have an up-to-date typing-extensions, see
          # https://github.com/astral-sh/uv/issues/6028#issuecomment-2287232150
          uv pip install -U typing-extensions
          uv pip install --compile-bytecode -r requirements-dev.txt -r requirements-ci.txt --verbose --index-strategy=unsafe-best-match
      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Polars
        run: |
          # Make sure we use the Polars we're about to build.
          uv pip uninstall polars-runtime-32 polars-runtime-64 polars-runtime-compat
          pip install --no-deps -e .
          maturin develop --manifest-path runtime/polars-runtime-32/Cargo.toml --features numa

      # The plugin is an abi3 extension module, which free-threaded builds cannot load.
      - name: Install polars_iceberg plugin
        if: matrix.python-version != '3.15t'
        env:
          POLARS_ICEBERG_VERSION: ${{ inputs.polars-iceberg-version }}
        run: |
          if [[ -n "$POLARS_ICEBERG_VERSION" ]]; then
            uv pip install --no-deps "polars-iceberg==$POLARS_ICEBERG_VERSION"
          else
            maturin develop --manifest-path polars-iceberg/Cargo.toml
          fi
          # The plugin tests skip when the module is missing; fail here instead.
          python -c 'import polars_iceberg'

      # The plugin is an abi3 extension module, which free-threaded builds cannot load.
      - name: Install polars_database plugin
        if: matrix.python-version != '3.15t'
        env:
          POLARS_DATABASE_VERSION: ${{ inputs.polars-database-version }}
        run: |
          if [[ -n "$POLARS_DATABASE_VERSION" ]]; then
            # `--no-deps` skips its `sqlglot` dependency, which requirements-dev.txt installs.
            uv pip install --no-deps "polars-database==$POLARS_DATABASE_VERSION"
          else
            maturin develop --manifest-path polars-database/Cargo.toml
          fi
          # The plugin tests skip when the module is missing; fail here instead.
          python -c 'import polars_database'

      - name: Run doctests
        if: github.event_name != 'push' && matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' && !matrix.variant
        run: |
          python tests/docs/run_doctest.py
          pytest tests/docs/test_user_guide.py -m docs

      - name: Run tests
        if: github.event_name != 'push' && matrix.python-version != '3.15t' && !matrix.variant
        env:
          POLARS_TIMEOUT_MS: 60000
        run: pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS"

      - name: Run Python tests - POLARS_ENGINE_AFFINITY=in-memory
        if: github.event_name != 'push' && matrix.python-version != '3.15t' && matrix.variant == 'engine_affinity_in_memory'
        env:
          POLARS_ENGINE_AFFINITY: in-memory
          POLARS_TIMEOUT_MS: 60000
        run: pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS"

      - name: Run tests async reader tests
        if: github.event_name != 'push' && matrix.os != 'windows-latest' && matrix.python-version != '3.15t' && !matrix.variant
        env:
          POLARS_FORCE_ASYNC: 1
          POLARS_TIMEOUT_MS: 60000
        run: pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS" tests/unit/io/

      - name: Run tests multiscan force empty capabilities
        if: github.event_name != 'push' && matrix.python-version != '3.15t' && !matrix.variant
        env:
          POLARS_FORCE_EMPTY_READER_CAPABILITIES: 1
          POLARS_TIMEOUT_MS: 60000
        run: |
          pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS" tests/unit/io/test_multiscan.py
          pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS" tests/unit/io/test_scan_row_deletion.py
          pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS" tests/unit/io/test_iceberg.py
          pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS" tests/unit/io/test_iceberg_plugin_suite.py

      - name: Check import without optional dependencies
        if: github.event_name != 'push' && matrix.os == 'ubuntu-latest' && (matrix.python-version == '3.14' || matrix.python-version == '3.15t')
        run: |
          declare -a deps=("pandas"
          "pyarrow"
          "fsspec"
          "matplotlib"
          "backports.zoneinfo"
          "connectorx"
          "pyiceberg"
          "deltalake"
          "xlsx2csv"
          )
          for d in "${deps[@]}"
          do
            echo "uninstall $i and check imports..."
            pip uninstall "$d" -y
            python -c 'import polars'
          done

      - name: Run free-threaded tests
        if: github.event_name != 'push' && matrix.python-version == '3.15t'
        run: |
          uv pip install $(grep -E '^(numpy|pandas|pyarrow|pydantic|hypothesis|pytest|pytest-xdist)([<>=!~]|$)' requirements-dev.txt)
          pytest -n auto -m "not release and not benchmark and not docs$EXTRA_PYTEST_MARKERS" tests/unit/constructors tests/unit/operations/test_comparison.py

  # A job-level `if` cannot see the matrix, so draft PRs get their own job reusing the steps above.
  test-python-draft:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' && github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    env: *test-python-env
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.14']
        variant: [null]
        ideal_morsel_size: [100000]

    steps: *test-python-steps

  test-python-passed:
    if: ${{ always() }}
    needs: [changes, test-python, test-python-draft]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        working-directory: .
        run: exit 1
