name: Test Rust

on:
  merge_group:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
      - "1.x"
    paths:
      - crates/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/test-rust.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.changes.outputs.changed == 'true' }}
    steps:
      - name: Check for relevant changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          # Keep in sync with `on.push.paths`.
          filters: |
            changed:
              - crates/**
              - examples/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .github/workflows/test-rust.yml

  test:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1
        if: ${{ runner.os == 'Linux' }}

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      # Note that we specify --lib, --bins etc
      # to exclude the doc tests.
      - name: Compile tests
        run: >
          cargo test --lib --tests --bins --all-features --no-run
          -p polars-arrow
          -p polars-cli
          -p polars-compute
          -p polars-core
          -p polars-defs
          -p polars-io
          -p polars-io-ext-ffi
          -p polars-lazy
          -p polars-ops
          -p polars-parquet
          -p polars-plan
          -p polars-row
          -p polars-sql
          -p polars-stream
          -p polars-time
          -p polars-utils

      - name: Run tests
        if: github.event_name != 'push'
        run: >
          cargo test --lib --tests --bins --all-features
          -p polars-arrow
          -p polars-cli
          -p polars-compute
          -p polars-core
          -p polars-defs
          -p polars-io
          -p polars-io-ext-ffi
          -p polars-lazy
          -p polars-ops
          -p polars-parquet
          -p polars-plan
          -p polars-row
          -p polars-sql
          -p polars-stream
          -p polars-time
          -p polars-utils

  integration-test:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1
        if: ${{ runner.os == 'Linux' }}

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Compile integration tests
        run: cargo test --all-features -p polars --test it --no-run

      - name: Run integration tests
        if: github.event_name != 'push'
        run: cargo test --all-features -p polars --test it

  check-features:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Run cargo hack
        run: cargo hack check -p polars --each-feature --no-dev-deps && cargo check -p polars-stream

      - name: Test pyo3-polars and bigidx
        run: cargo check -p pyo3-polars --no-default-features --features pyo3-polars/derive,polars/bigidx

  check-dsl-schema:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Build DSL schema check
        run: cargo build --all-features

      - name: Run DSL schema check
        run: ./target/debug/dsl-schema check-hashes

  test-rust-passed:
    if: ${{ always() }}
    needs: [changes, test, integration-test, check-features, check-dsl-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
