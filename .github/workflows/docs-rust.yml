name: Build Rust documentation

on:
  merge_group:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths:
      - crates/**
      - .github/workflows/docs-rust.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.changes.outputs.changed == 'true' }}
    steps:
      - name: Check for relevant changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          # Keep in sync with `on.push.paths`.
          filters: |
            changed:
              - crates/**
              - .github/workflows/docs-rust.yml

  build-rust-docs:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup component add rust-docs

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Build Rust documentation
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings --allow=rustdoc::redundant-explicit-links
        working-directory: crates
        run: make doctest

      - name: Create redirect to Polars crate and set no-jekyll
        if: ${{ github.ref_name == 'main' }}
        run: |
          echo '<meta http-equiv=refresh content=0;url=polars/index.html>' > target/doc/index.html
          touch target/doc/.nojekyll

      - name: Deploy Rust docs
        if: ${{ github.ref_name == 'main' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/doc
          target-folder: api/rust/dev
          single-commit: true

      # Make sure documentation artifacts are not cached
      - name: Clean up documentation artifacts
        if: ${{ github.ref_name == 'main' }}
        run: rm -rf target/doc

  docs-rust-passed:
    if: ${{ always() }}
    needs: [changes, build-rust-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
