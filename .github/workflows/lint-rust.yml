name: Lint Rust

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - "1.x"
    paths:
      - crates/**
      - docs/source/src/rust/**
      - examples/**
      - pyo3-polars/**
      - pyo3-polars/Cargo.toml
      - py-polars/src/**
      - py-polars/Cargo.toml
      - py-polars/polars-database/**
      - py-polars/polars-iceberg/**
      - deny.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/lint-rust.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0  # Do not produce debug symbols to keep memory usage down

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.changes.outputs.changed == 'true' }}
    steps:
      - name: Check for relevant changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          # Keep in sync with `on.push.paths`.
          filters: |
            changed:
              - crates/**
              - docs/source/src/rust/**
              - examples/**
              - pyo3-polars/**
              - pyo3-polars/Cargo.toml
              - py-polars/src/**
              - py-polars/Cargo.toml
              - py-polars/polars-database/**
              - py-polars/polars-iceberg/**
              - deny.toml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .github/workflows/lint-rust.yml

  clippy-nightly:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup component add clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Run cargo clippy with all features enabled
        run: python3 tools/cargo-fail-warning.py clippy --workspace --all-targets --all-features --locked -- -W clippy::dbg_macro

  # Default feature set should compile on the stable toolchain
  clippy-stable:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup override set stable && rustup update

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Run cargo clippy
        run: python3 tools/cargo-fail-warning.py clippy --all-targets --locked -- -W clippy::dbg_macro

  rustfmt:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup component add rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all --check

  miri:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Set up Rust
        run: rustup component add miri

      - name: Set up miri
        run: cargo miri setup

      - name: Run miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-disable-stacked-borrows
          POLARS_ALLOW_EXTENSION: '1'
          POLARS_OVERRIDE_TOTAL_MEMORY_MB: '1000'  # So we don't ask for memory which miri doesn't support
        run: >
          cargo miri test
          --features object
          -p polars-core
#          -p polars-arrow

  deny:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  lint-rust-passed:
    if: ${{ always() }}
    needs: [changes, clippy-nightly, clippy-stable, rustfmt, miri, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
