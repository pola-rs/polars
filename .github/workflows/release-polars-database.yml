name: Release polars-database

# Releases the `polars-database` I/O plugin (`py-polars/polars-database` in this repository) to
# PyPI.
#
# The version is the `version` of the wrapper crate `py-polars/polars-database/Cargo.toml`, which
# must be the one in its `pyproject.toml` (the wheels take theirs from there) and in
# `crates/polars-database/Cargo.toml` (the module's `__version__`). The plugin is an abi3 wheel,
# so one wheel per target covers every supported Python version.
#
# The `version` job resolves the commit once; the other jobs build that commit. After publishing,
# the release tags it `polars-database-<version>`.

on:
  workflow_dispatch:
    inputs:
      # Commit to release. If omitted, use the latest commit of the branch the workflow runs on.
      sha:
        description: Commit SHA
        type: string
      # Create the sdist and build the wheels, but do not publish to PyPI or tag the commit.
      dry-run:
        description: Dry run
        type: boolean
        default: false

# Releases queue rather than cancel each other: a cancelled run may have uploaded part of a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'
  PYTHON_VERSION_WIN_ARM64: '3.11' # ARM64 Windows doesn't have older versions
  MANIFEST_PATH: py-polars/polars-database/Cargo.toml
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The commit every job builds.
      sha: ${{ steps.commits.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      # Whether the tag exists already, on this commit (a rerun).
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Read polars-database version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("py-polars/polars-database/Cargo.toml", "rb"))["package"]["version"])')
          echo "polars-database version: $VERSION"
          # A static pyproject version is what maturin builds the wheels with.
          PY_VERSION=$(python3 -c 'import tomllib; p = tomllib.load(open("py-polars/polars-database/pyproject.toml", "rb"))["project"]; print("" if "version" in p.get("dynamic", []) else p.get("version", ""))')
          if [[ "$PY_VERSION" != "$VERSION" ]]; then
            echo "::error::polars-database pyproject.toml version '$PY_VERSION' does not match Cargo.toml version $VERSION"
            exit 1
          fi
          # The module's `__version__` comes from the plugin crate.
          LIB_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/polars-database/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$LIB_VERSION" != "$VERSION" ]]; then
            echo "::error::crates/polars-database version $LIB_VERSION does not match $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve commit
        id: commits
        run: |
          SHA=$(git rev-parse HEAD)
          echo "commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # A tag on another commit means the version was released before: bump it.
      - name: Check the tag
        id: tag
        env:
          TAG: polars-database-${{ steps.version.outputs.version }}
          SHA: ${{ steps.commits.outputs.sha }}
        run: |
          # The last line is the commit, also for an annotated tag (`<tag>^{}`).
          TAGGED=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)
          if [[ -n "$TAGGED" && "$TAGGED" != "$SHA" ]]; then
            echo "::error::$TAG already tags $TAGGED: bump the polars-database version to release $SHA"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tagged=$([[ -n "$TAGGED" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  create-sdist:
    needs: [version]
    runs-on: ubuntu-latest
    env:
      POLARS_DATABASE_BUILD_COMMIT: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path ${{ env.MANIFEST_PATH }}
            --out dist
          maturin-version: 1.15.0

      - name: Test sdist
        run: |
          pip install --force-reinstall --verbose dist/*.tar.gz
          python -c 'import polars_database'

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist-polars-database
          path: dist/*.tar.gz

  build-wheels:
    needs: [version]
    runs-on: ${{ matrix.os }}
    env:
      POLARS_DATABASE_BUILD_COMMIT: ${{ needs.version.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        job_config: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, macos-x64, macos-arm64, win-x64, win-arm64]
        include:
          - job_config: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - job_config: linux-arm64
            os: linux-arm-large
            target: aarch64-unknown-linux-gnu
          - job_config: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - job_config: linux-musl-arm64
            os: linux-arm-large
            target: aarch64-unknown-linux-musl
          - job_config: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - job_config: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - job_config: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - job_config: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      # After the checkout, which the local action needs.
      - name: Setup build environment (ARM64 Windows)
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/actions/setup-windows-arm64

      # The wheel is abi3 for Python 3.10+ whichever Python builds it.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.os == 'windows-11-arm' && env.PYTHON_VERSION_WIN_ARM64 || env.PYTHON_VERSION }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          # `maturin-action` only forwards environment variables matching a fixed prefix
          # allowlist into the manylinux/musllinux container, so `POLARS_DATABASE_BUILD_COMMIT` has
          # to be passed through explicitly.
          docker-options: -e POLARS_DATABASE_BUILD_COMMIT
          args: >
            --profile ${{ inputs.dry-run == true && 'dev' || 'dist-release' }}
            --manifest-path ${{ env.MANIFEST_PATH }}
            --out dist
          manylinux: auto
          maturin-version: 1.15.0

      - name: Test wheel
        # musl wheels cannot be installed on the glibc runners.
        if: endsWith(matrix.target, '-musl') == false
        run: |
          pip install --force-reinstall --verbose dist/*.whl
          # The Python release compares this commit with its own sources.
          # `tr`: Python on Windows ends the line with CRLF.
          COMMIT=$(python -c 'import polars_database; print(polars_database.__build_commit__)' | tr -d '\r')
          if [[ "$COMMIT" != "$POLARS_DATABASE_BUILD_COMMIT" ]]; then
            echo "::error::__build_commit__ is '$COMMIT', expected $POLARS_DATABASE_BUILD_COMMIT"
            exit 1
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-polars-database-${{ matrix.job_config }}
          path: dist/*.whl

  publish-to-pypi:
    needs: [version, create-sdist, build-wheels]
    environment:
      name: release-polars-database
      url: https://pypi.org/project/polars-database
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check sdist and wheel versions match Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls dist
          for f in dist/*; do
            name=$(basename "$f")
            if [[ "$name" != "polars_database-$VERSION.tar.gz" && "$name" != "polars_database-$VERSION-"*.whl ]]; then
              echo "::error::$name does not have polars-database version $VERSION"
              exit 1
            fi
          done

      # A release of the same version from another commit: with `skip-existing` alone that
      # went green while PyPI kept the old files. The version may be on PyPI only as files of
      # these very builds (a rerun after some were uploaded): each file PyPI lists must
      # match one of `dist/` by SHA-256, or the release fails. After a partial upload, use
      # "Re-run failed jobs": "Re-run all jobs" rebuilds `dist/`, which won't match.
      - name: Check the version is not on PyPI with other files
        if: inputs.dry-run == false
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          status=$(curl -s -o pypi.json -w '%{http_code}' "https://pypi.org/pypi/polars-database/$VERSION/json")
          case "$status" in
            404) echo "polars-database $VERSION is not on PyPI yet" ;;
            200)
              python3 - <<'PY'
          import hashlib, json, pathlib, sys
          listed = {u["filename"]: u["digests"]["sha256"] for u in json.load(open("pypi.json"))["urls"]}
          local = {f.name: hashlib.sha256(f.read_bytes()).hexdigest() for f in pathlib.Path("dist").iterdir()}
          bad = sorted(n for n, d in listed.items() if local.get(n) != d)
          if bad:
              print(f"::error::polars-database is already on PyPI with files that differ from this build: {bad}. Bump the version in Cargo.toml and pyproject.toml, and release again")
              sys.exit(1)
          print(f"PyPI holds {len(listed)} file(s) of this build already")
          PY
              ;;
            *)
              echo "::error::PyPI answered HTTP $status for polars-database $VERSION"
              exit 1
              ;;
          esac

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # the check above made sure what exists is this build's
          skip-existing: true
          verbose: true

  tag:
    needs: [version, publish-to-pypi]
    if: inputs.dry-run == false && needs.version.outputs.tagged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
