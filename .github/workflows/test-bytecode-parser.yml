name: Test Bytecode Parser

on:
  merge_group:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/actions

      - name: Check for relevant changes
        id: changes
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            py-polars/
            .github/scripts/test_bytecode_parser.py
            .github/workflows/test-bytecode-parser.yml

  ubuntu:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the versions that are not already run as part of the regular test suite
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install ipython numpy pytest

      - name: Run tests
        env:
          PYTHONPATH: "py-polars/src:py-polars/runtime/polars-runtime-32:py-polars"
        run: pytest .github/scripts/test_bytecode_parser.py

  test-bytecode-parser-passed:
    if: ${{ always() }}
    needs: [changes, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
