name: Build documentation

on:
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs-global.yml
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs-global.yml
  repository_dispatch:
    types:
      - python-release-docs
  workflow_dispatch:

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha }}
      - uses: tcort/github-action-markdown-link-check@v1.1.1
        with:
          config-file: docs/mlc-config.json
          folder-path: docs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha }}

      - name: Get ruff version from requirements file
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'ruff==\K(.*)' py-polars/requirements-lint.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: chartboost/ruff-action@v1
        with:
          src: docs/source/
          version: ${{ steps.version.outputs.version }}
          args: check --no-fix

      - uses: chartboost/ruff-action@v1
        with:
          src: docs/source/
          version: ${{ steps.version.outputs.version }}
          args: format --diff

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha }}

      - name: Free some disk space (remove unused packages)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          echo "VENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          uv pip install -r py-polars/requirements-dev.txt -r docs/source/requirements.txt
          uv pip install --no-deps -e py-polars

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageVersion
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Polars
        working-directory: py-polars
        run: |
          # Make sure we use the Polars we're about to build.
          uv pip uninstall polars-runtime-32 polars-runtime-64 polars-runtime-compat
          uv pip install --no-deps -e .
          make build

      - name: Set up Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      # zensical has no hooks; whatever used to run as mkdocs on_startup hook below
      - name: Generate contributor list
        run: python docs/source/_build/scripts/people.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: |
          set -o pipefail

          # zensical renders traceback in the page; error out if any code block failed
          zensical build 2>&1 | tee zensical-build.log
          if grep -q 'Execution of python code block exited with errors' zensical-build.log; then
            echo '::error::A Python code block failed to execute, see the build log above'
            exit 1
          fi
          rm zensical-build.log

          # prune build files befer publishing to avoid dragging that with us
          rm -rf \
            site/_build/API_REFERENCE_LINKS.yml \
            site/_build/overrides \
            site/_build/scripts \
            site/_build/snippets \
            site/pyproject.toml \
            site/requirements.txt \
            site/src

      - name: Add .nojekyll
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        working-directory: site
        run: touch .nojekyll

      - name: Deploy docs
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          # docs/ and py-polars/ included for backwards compatibility
          clean-exclude: |
            api/python/
            api/rust/
            docs/python
            docs/rust
            py-polars/html
          single-commit: true
